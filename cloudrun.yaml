apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stream-tag-inventory
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: "256Mi"
          # NOTE: PORT env var は Cloud Run が containerPort から自動注入するため設定禁止 (予約環境変数)
          env:
            - name: DB_USER
              value: stream_tag_inventory
            - name: DB_NAME
              value: stream_tag_inventory
            # NOTE: service は app user pw (DML のみ)。owner pw (stream-tag-inventory-db-password) は migration job 側で使う
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: stream-tag-inventory-db-app-password
            # Twitch OIDC 用。client_id は OAuth の仕様上公開値 (client/src/constant.ts にも平文)、
            # かつ static/index.js に焼き込まれてブラウザから可視なので平文 value で扱う。
            # 本番用に別 Twitch app を作る場合も値自体は公開情報のため repo に commit してよい。
            - name: TWITCH_CLIENT_ID
              value: d2kz8x5se7k6b1n0picux0r7kaozi3
            - name: APP_BASE_URL
              value: https://tags.yuniruyuni.net
        - image: cloudflare/cloudflared:latest
          args:
            - access
            - tcp
            - --hostname
            - db.yuniruyuni.net
            - --url
            - localhost:5432
          env:
            - name: TUNNEL_SERVICE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: cf-db-access-client-id
            - name: TUNNEL_SERVICE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: cf-db-access-client-secret
          resources:
            limits:
              cpu: "0.5"
              memory: "128Mi"
