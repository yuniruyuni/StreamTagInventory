apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stream-tag-inventory
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/container-dependencies: '{"app":["db-tunnel"]}'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: "256Mi"
          # NOTE: PORT env var は Cloud Run が containerPort から自動注入するため設定禁止 (予約環境変数)
          env:
            # service は app user (DML のみ) を使う。owner (DDL 可) は migration job 専用。
            # app user は infra (yuniruyuni.net repo の nixos/services/postgresql.nix) で
            # 宣言的に CREATE + GRANT されており、パスワードは age secret を source of
            # truth として activation 毎に ALTER USER で set される。GCP Secret Manager 側の
            # stream-tag-inventory-db-app-password の値は age secret と手動で一致させる運用。
            - name: DB_USER
              value: stream_tag_inventory_app
            - name: DB_NAME
              value: stream_tag_inventory
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: stream-tag-inventory-db-app-password
            # Twitch OIDC 用。client_id は OAuth の仕様上公開値 (client/src/constant.ts にも平文)、
            # かつ static/index.js に焼き込まれてブラウザから可視なので平文 value で扱う。
            # 本番用に別 Twitch app を作る場合も値自体は公開情報のため repo に commit してよい。
            - name: TWITCH_CLIENT_ID
              value: d2kz8x5se7k6b1n0picux0r7kaozi3
            - name: APP_BASE_URL
              value: https://tags.yuniruyuni.net
        - name: db-tunnel
          image: cloudflare/cloudflared:latest
          args:
            - access
            - tcp
            - --hostname
            - db.yuniruyuni.net
            - --url
            - 0.0.0.0:5432
          env:
            # client_id は CF-Access-Client-Id ヘッダで送る識別子で、認証には
            # client_secret が要る。Secret Manager は active version 数で課金される
            # ため、秘匿の要らない client_id は deploy 時に CI から埋め込む。
            # public repo なので値は commit せず GitHub secret 経由で置換する。
            - name: TUNNEL_SERVICE_TOKEN_ID
              value: CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER
            - name: TUNNEL_SERVICE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: cf-db-access-client-secret
          resources:
            limits:
              cpu: "0.5"
              memory: "128Mi"
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
