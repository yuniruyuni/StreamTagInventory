<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" font-size="12">
  <rect width="1100" height="1020" fill="#fafafa"/>

  <text x="550" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">OIDC Implicit Hybrid Flow 認証シーケンス</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5a9a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e8e3e"/>
    </marker>
  </defs>

  <!-- Actor boxes -->
  <rect x="110" y="55" width="140" height="40" fill="#4a7dc9" stroke="#2c5a9a" rx="4"/>
  <text x="180" y="80" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Browser</text>

  <rect x="480" y="55" width="140" height="40" fill="#5cb85c" stroke="#3e8e3e" rx="4"/>
  <text x="550" y="80" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Hono Server</text>

  <rect x="850" y="55" width="140" height="40" fill="#9146ff" stroke="#6b30c2" rx="4"/>
  <text x="920" y="80" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Twitch IdP</text>

  <!-- Lifelines -->
  <line x1="180" y1="95" x2="180" y2="1000" stroke="#bbb" stroke-dasharray="4,4"/>
  <line x1="550" y1="95" x2="550" y2="1000" stroke="#bbb" stroke-dasharray="4,4"/>
  <line x1="920" y1="95" x2="920" y2="1000" stroke="#bbb" stroke-dasharray="4,4"/>

  <!-- Step 1 -->
  <g>
    <circle cx="90" cy="130" r="11" fill="#2c5a9a"/>
    <text x="90" y="134" text-anchor="middle" fill="white" font-size="11" font-weight="bold">1</text>
    <line x1="180" y1="130" x2="545" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="362" y="124" text-anchor="middle" fill="#222">GET /api/trpc/auth.me</text>
    <line x1="550" y1="155" x2="185" y2="155" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
    <text x="367" y="149" text-anchor="middle" fill="#666" font-style="italic">← UNAUTHORIZED</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="90" cy="195" r="11" fill="#2c5a9a"/>
    <text x="90" y="199" text-anchor="middle" fill="white" font-size="11" font-weight="bold">2</text>
    <line x1="180" y1="195" x2="545" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="362" y="189" text-anchor="middle">POST /api/trpc/auth.startNonce</text>

    <rect x="545" y="205" width="370" height="42" fill="#fff9d6" stroke="#d4b84a" rx="3"/>
    <text x="730" y="221" text-anchor="middle" font-size="11">nonce 生成</text>
    <text x="730" y="238" text-anchor="middle" font-size="11">oidc_nonces INSERT (10 分 expire)</text>

    <line x1="550" y1="270" x2="185" y2="270" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
    <text x="367" y="264" text-anchor="middle" fill="#666" font-style="italic">← { nonce }</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="90" cy="315" r="11" fill="#2c5a9a"/>
    <text x="90" y="319" text-anchor="middle" fill="white" font-size="11" font-weight="bold">3</text>
    <line x1="180" y1="315" x2="915" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="547" y="308" text-anchor="middle" font-weight="bold">GET https://id.twitch.tv/oauth2/authorize</text>
    <text x="547" y="330" text-anchor="middle" font-size="11" fill="#444">response_type=token+id_token &amp; client_id=... &amp; redirect_uri=tags.yuniruyuni.net/</text>
    <text x="547" y="346" text-anchor="middle" font-size="11" fill="#444">scope=openid+user:edit:broadcast+channel:manage:broadcast &amp; nonce=&lt;nonce&gt;</text>
    <text x="547" y="362" text-anchor="middle" font-size="11" fill="#444">claims={"id_token":{"preferred_username":null}}</text>
  </g>

  <!-- Step 4: self-loop on Twitch -->
  <g>
    <circle cx="90" cy="400" r="11" fill="#2c5a9a"/>
    <text x="90" y="404" text-anchor="middle" fill="white" font-size="11" font-weight="bold">4</text>
    <path d="M 920,395 Q 985,395 985,418 Q 985,440 920,440" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="975" y="422" text-anchor="end" fill="#222">ユーザー同意</text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle cx="90" cy="480" r="11" fill="#2c5a9a"/>
    <text x="90" y="484" text-anchor="middle" fill="white" font-size="11" font-weight="bold">5</text>
    <line x1="920" y1="480" x2="185" y2="480" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="547" y="473" text-anchor="middle" font-weight="bold">302 → /#access_token=...&amp;id_token=...</text>
    <text x="547" y="496" text-anchor="middle" font-size="11" fill="#444">(URL fragment)</text>
  </g>

  <!-- Step 6: self-loop on Browser -->
  <g>
    <circle cx="90" cy="530" r="11" fill="#2c5a9a"/>
    <text x="90" y="534" text-anchor="middle" fill="white" font-size="11" font-weight="bold">6</text>
    <path d="M 180,525 Q 245,525 245,550 Q 245,575 180,575" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="260" y="540" fill="#222">JS が fragment parse:</text>
    <text x="260" y="557" fill="#444" font-size="11">・access_token → sessionStorage</text>
    <text x="260" y="573" fill="#444" font-size="11">・id_token → POST /api/trpc/auth.login へ</text>
  </g>

  <!-- Step 7 -->
  <g>
    <circle cx="90" cy="615" r="11" fill="#2c5a9a"/>
    <text x="90" y="619" text-anchor="middle" fill="white" font-size="11" font-weight="bold">7</text>
    <line x1="180" y1="615" x2="545" y2="615" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="362" y="609" text-anchor="middle" font-weight="bold">POST /api/trpc/auth.login { idToken }</text>

    <rect x="545" y="625" width="370" height="162" fill="#fff9d6" stroke="#d4b84a" rx="3"/>
    <text x="560" y="642" font-size="11">a. JWKS で RS256 署名検証</text>
    <text x="560" y="660" font-size="11">b. iss / aud / exp / nonce 検証</text>
    <text x="560" y="678" font-size="11">c. nonce を atomic SELECT+DELETE (consume)</text>
    <text x="560" y="696" font-size="11">d. payload.sub から Twitch user id 取得</text>
    <text x="560" y="714" font-size="11">e. preferred_username から display_name 取得</text>
    <text x="560" y="732" font-size="11">f. (transaction) users upsert + sessions INSERT</text>
    <text x="560" y="750" font-size="11">g. Set-Cookie: __Host-sid</text>
    <text x="575" y="768" font-size="11" fill="#666">(HttpOnly, Secure, SameSite=Lax, 30 日)</text>

    <line x1="550" y1="810" x2="185" y2="810" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
    <text x="367" y="804" text-anchor="middle" fill="#666" font-style="italic">← { user, csrfToken } + Set-Cookie</text>
  </g>

  <!-- Step 8: self-loop on Browser -->
  <g>
    <circle cx="90" cy="850" r="11" fill="#2c5a9a"/>
    <text x="90" y="854" text-anchor="middle" fill="white" font-size="11" font-weight="bold">8</text>
    <path d="M 180,845 Q 245,845 245,865 Q 245,885 180,885" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="260" y="870" fill="#222">URL fragment クリア (history.replaceState)</text>
  </g>

  <!-- Step 9 -->
  <g>
    <circle cx="90" cy="930" r="11" fill="#2c5a9a"/>
    <text x="90" y="934" text-anchor="middle" fill="white" font-size="11" font-weight="bold">9</text>
    <text x="115" y="920" font-weight="bold" fill="#222">以降の通信:</text>

    <line x1="180" y1="950" x2="915" y2="950" stroke="#2c5a9a" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="547" y="944" text-anchor="middle" fill="#2c5a9a" font-size="11">Twitch API: sessionStorage の access_token を直接使用 (既存コード無変更)</text>

    <line x1="180" y1="985" x2="545" y2="985" stroke="#3e8e3e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="362" y="979" text-anchor="middle" fill="#3e8e3e" font-size="11">テンプレート CRUD / postTemplate: Cookie + csrfToken ヘッダー</text>
  </g>
</svg>
