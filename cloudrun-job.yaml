apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: stream-tag-inventory-migrate
spec:
  template:
    spec:
      template:
        spec:
          maxRetries: 1
          timeoutSeconds: 300
          containers:
            - image: MIGRATE_IMAGE_PLACEHOLDER
              env:
                - name: DB_APP_NAME
                  value: stream_tag_inventory
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: stream-tag-inventory-db-password
              resources:
                limits:
                  cpu: "1"
                  memory: "512Mi"
            - image: cloudflare/cloudflared:latest
              args:
                - access
                - tcp
                - --hostname
                - db.yuniruyuni.net
                - --url
                - localhost:5432
              env:
                - name: TUNNEL_SERVICE_TOKEN_ID
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: cf-db-access-client-id
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: cf-db-access-client-secret
              resources:
                limits:
                  cpu: "0.5"
                  memory: "256Mi"
