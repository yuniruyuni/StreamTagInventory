apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: stream-tag-inventory-migration
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: '{"migration":["db-tunnel"]}'
    spec:
      template:
        spec:
          maxRetries: 1
          timeoutSeconds: 300
          containers:
            - name: migration
              image: IMAGE_PLACEHOLDER
              env:
                - name: DB_USER
                  value: stream_tag_inventory
                - name: DB_NAME
                  value: stream_tag_inventory
                # NOTE: migration job は owner pw (DDL 必要)。-app- サフィックス付きの app user pw は使わない
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: stream-tag-inventory-db-password
              resources:
                limits:
                  cpu: "1"
                  # NOTE: Cloud Run gen2 実行環境の合計最小 memory 要件 (512Mi) を満たすため明示指定必須
                  memory: "512Mi"
            - name: db-tunnel
              image: cloudflare/cloudflared:latest
              args:
                - access
                - tcp
                - --hostname
                - db.yuniruyuni.net
                - --url
                - 0.0.0.0:5432
              env:
                # cloudrun.yaml と同様、client_id は deploy 時に CI から埋め込む。
                - name: TUNNEL_SERVICE_TOKEN_ID
                  value: CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: cf-db-access-client-secret
              resources:
                limits:
                  cpu: "0.5"
                  memory: "256Mi"
              startupProbe:
                tcpSocket:
                  port: 5432
                periodSeconds: 1
                timeoutSeconds: 1
                failureThreshold: 30
