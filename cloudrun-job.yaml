apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: stream-tag-inventory-migration
spec:
  template:
    spec:
      template:
        spec:
          maxRetries: 1
          timeoutSeconds: 300
          containers:
            - image: IMAGE_PLACEHOLDER
              env:
                - name: DB_USER
                  value: stream_tag_inventory
                - name: DB_NAME
                  value: stream_tag_inventory
                # NOTE: migration job は owner pw (DDL 必要)。-app- サフィックス付きの app user pw は使わない
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: stream-tag-inventory-db-password
              resources:
                limits:
                  cpu: "1"
                  # NOTE: Cloud Run gen2 実行環境の合計最小 memory 要件 (512Mi) を満たすため明示指定必須
                  memory: "512Mi"
            - image: cloudflare/cloudflared:latest
              args:
                - access
                - tcp
                - --hostname
                - db.yuniruyuni.net
                - --url
                - localhost:5432
              env:
                - name: TUNNEL_SERVICE_TOKEN_ID
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: cf-db-access-client-id
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: latest
                      name: cf-db-access-client-secret
              resources:
                limits:
                  cpu: "0.5"
                  memory: "256Mi"
