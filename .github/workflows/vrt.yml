name: Visual Regression Test

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      actual-sha: ${{ steps.prepare.outputs.actual-sha }}
      actual-cache-hit: ${{ steps.prepare.outputs.actual-cache-hit }}
      expected-sha: ${{ steps.prepare.outputs.expected-sha }}
      expected-cache-hit: ${{ steps.prepare.outputs.expected-cache-hit }}
    steps:
      - uses: yorifuji/easy-vrt/prepare@v2
        id: prepare

  expected:
    if: ${{ !cancelled() && !failure() }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.expected-sha }}

      - name: Use current VRT harness
        run: |
          git fetch --depth=1 origin ${{ needs.prepare.outputs.actual-sha }}
          git checkout ${{ needs.prepare.outputs.actual-sha }} -- e2e/helpers/waitForCSS.ts

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Generate screenshots
        run: cd e2e && bunx playwright test --update-snapshots --project=chromium --timeout=60000
        env:
          CI: true
          SKIP_DB_VERIFY: "1"
          TWITCH_CLIENT_ID: ci-vrt-dummy

      - uses: yorifuji/easy-vrt/expected@v2
        with:
          expected-dir: e2e/__snapshots__/
          expected-cache-key: ${{ needs.prepare.outputs.expected-sha }}-${{ github.run_id }}

  actual:
    if: ${{ !cancelled() && !failure() }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.actual-sha }}

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Generate screenshots
        run: cd e2e && bunx playwright test --update-snapshots --project=chromium --timeout=60000
        env:
          CI: true
          SKIP_DB_VERIFY: "1"
          TWITCH_CLIENT_ID: ci-vrt-dummy

      - uses: yorifuji/easy-vrt/actual@v2
        with:
          actual-dir: e2e/__snapshots__/
          actual-cache-key: ${{ needs.prepare.outputs.actual-sha }}-${{ github.run_id }}

  compare:
    if: ${{ !cancelled() && !failure() }}
    needs: [prepare, expected, actual]
    runs-on: ubuntu-latest
    steps:
      - uses: yorifuji/easy-vrt/compare@v2
        with:
          expected-cache-key: ${{ needs.prepare.outputs.expected-sha }}-${{ github.run_id }}
          actual-cache-key: ${{ needs.prepare.outputs.actual-sha }}-${{ github.run_id }}
          summary-comment: true
          review-comment: true

      - name: Fail on visual differences
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const report = JSON.parse(
            fs.readFileSync(".easy-vrt/report.json", "utf8"),
          );
          const changed =
            report.failedItems.length +
            report.newItems.length +
            report.deletedItems.length;
          if (changed > 0) {
            console.error(
              `Visual differences detected: ${report.failedItems.length} changed, ${report.newItems.length} new, ${report.deletedItems.length} deleted`,
            );
            process.exit(1);
          }
          JS
