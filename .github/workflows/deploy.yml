name: Deploy to Cloud Run

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GCP_REGION: us-west1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: stream-tag-inventory
  SHA: ${{ github.sha }}

jobs:
  build-app:
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: Dockerfile
      image_name: stream-tag-inventory
      # production 用 client bundle に焼き込む public env (BUN_PUBLIC_* allowlist 経由)。
      # 本番 Twitch app の client_id は OAuth 仕様上公開値、APP_BASE_URL は
      # redirect_uri 構築に使う。これを渡さないと bundle 内 default の
      # http://localhost:3000 が焼き込まれて Twitch redirect が production で機能しない。
      build_args: |
        BUN_PUBLIC_TWITCH_CLIENT_ID=d2kz8x5se7k6b1n0picux0r7kaozi3
        BUN_PUBLIC_APP_BASE_URL=https://tags.yuniruyuni.net
    secrets: inherit

  build-migration:
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: Dockerfile.migration
      image_name: stream-tag-inventory-migrate
    secrets: inherit

  migrate:
    needs: [build-migration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run migration
        env:
          CF_DB_ACCESS_CLIENT_ID: ${{ secrets.CF_DB_ACCESS_CLIENT_ID }}
        run: |
          if [ -z "$CF_DB_ACCESS_CLIENT_ID" ]; then
            echo "CF_DB_ACCESS_CLIENT_ID secret is not set" >&2
            exit 1
          fi
          MIGRATE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/apps/${SERVICE_NAME}-migrate:${SHA}"
          sed -i "s|IMAGE_PLACEHOLDER|$MIGRATE_TAG|g" cloudrun-job.yaml
          sed -i "s|CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER|$CF_DB_ACCESS_CLIENT_ID|g" cloudrun-job.yaml
          # 置換漏れは cloudflared の認証失敗として実行時にしか現れないのでここで落とす
          if grep -q CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER cloudrun-job.yaml; then
            echo "CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER was not substituted" >&2
            exit 1
          fi
          gcloud run jobs replace cloudrun-job.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
          gcloud run jobs execute "${SERVICE_NAME}-migration" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --wait

  deploy:
    needs: [build-app, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          CF_DB_ACCESS_CLIENT_ID: ${{ secrets.CF_DB_ACCESS_CLIENT_ID }}
        run: |
          if [ -z "$CF_DB_ACCESS_CLIENT_ID" ]; then
            echo "CF_DB_ACCESS_CLIENT_ID secret is not set" >&2
            exit 1
          fi
          IMAGE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/apps/${SERVICE_NAME}:${SHA}"
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|g" cloudrun.yaml
          sed -i "s|CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER|$CF_DB_ACCESS_CLIENT_ID|g" cloudrun.yaml
          # 置換漏れは cloudflared の認証失敗として実行時にしか現れないのでここで落とす
          if grep -q CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER cloudrun.yaml; then
            echo "CF_DB_ACCESS_CLIENT_ID_PLACEHOLDER was not substituted" >&2
            exit 1
          fi
          gcloud run services replace cloudrun.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Smoke test deployed service
        run: |
          curl --fail --silent --show-error https://tags.yuniruyuni.net/health

          auth_status="$(
            curl --silent --show-error \
              --output /tmp/auth-me.json \
              --write-out "%{http_code}" \
              "https://tags.yuniruyuni.net/api/trpc/auth.me?batch=1&input=%7B%7D"
          )"
          if [ "$auth_status" != "401" ]; then
            echo "Expected auth.me to return 401 for an unauthenticated request, got ${auth_status}"
            cat /tmp/auth-me.json
            exit 1
          fi
          grep --quiet '"UNAUTHORIZED"' /tmp/auth-me.json
