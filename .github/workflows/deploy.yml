name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-app:
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: Dockerfile
      image_name: stream-tag-inventory
    secrets: inherit

  build-migration:
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: Dockerfile.migration
      image_name: stream-tag-inventory-migrate
    secrets: inherit

  migrate:
    needs: [build-migration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run migration
        env:
          GCP_REGION: us-west1
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE_NAME: stream-tag-inventory
          SHA: ${{ github.sha }}
        run: |
          MIGRATE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/apps/${SERVICE_NAME}-migrate:${SHA}"
          sed -i "s|MIGRATE_IMAGE_PLACEHOLDER|$MIGRATE_TAG|g" cloudrun-job.yaml
          gcloud run jobs replace cloudrun-job.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
          gcloud run jobs execute "${SERVICE_NAME}-migrate" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --wait

  deploy:
    needs: [build-app, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          GCP_REGION: us-west1
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE_NAME: stream-tag-inventory
          SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/apps/${SERVICE_NAME}:${SHA}"
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|g" cloudrun.yaml
          gcloud run services replace cloudrun.yaml \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
