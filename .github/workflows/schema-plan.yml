name: Schema Plan

on:
  pull_request:
    paths: ["db/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planuser
          POSTGRES_PASSWORD: planpass
          POSTGRES_DB: plandb
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply main branch schema (current state)
        run: |
          # Extract main branch's db/ directory to simulate current production DB
          if git show origin/main:db/schema.sql > /dev/null 2>&1; then
            mkdir -p /tmp/main_db
            git archive origin/main -- db/ | tar -x -C /tmp/main_db
            docker run --rm --network host \
              -v /tmp/main_db/db:/schema:ro \
              pgschema/pgschema apply \
              --file /schema/schema.sql \
              --host localhost --port 5432 \
              --user planuser --password planpass --db plandb
            echo "Applied main branch schema as baseline."
          else
            echo "No db/schema.sql on main branch — planning against empty DB (initial migration)."
          fi

      - name: Plan PR schema changes (diff from main)
        run: |
          docker run --rm --network host \
            -v "${WORKSPACE}/db:/schema:ro" \
            pgschema/pgschema plan \
            --file /schema/schema.sql \
            --host localhost --port 5432 \
            --user planuser --password planpass --db plandb \
            > plan_output.txt 2>&1 || true

      - name: Comment plan on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PLAN=$(cat plan_output.txt)
          gh pr comment "$PR_NUMBER" --body "## pgschema plan
          \`\`\`sql
          ${PLAN}
          \`\`\`"
