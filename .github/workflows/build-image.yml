name: Build and Push Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image_suffix:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GCP_REGION: us-west1
  SERVICE_NAME: stream-tag-inventory

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f ${{ inputs.dockerfile }} \
            -t ${{ env.SERVICE_NAME }}${{ inputs.image_suffix }}:${{ github.sha }} .

      - name: Push to Artifact Registry
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/apps/${{ env.SERVICE_NAME }}${{ inputs.image_suffix }}:${{ github.sha }}"
          docker tag ${{ env.SERVICE_NAME }}${{ inputs.image_suffix }}:${{ github.sha }} $IMAGE_TAG
          docker push $IMAGE_TAG

      - name: Push to GHCR (archive)
        run: |
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/${{ env.SERVICE_NAME }}${{ inputs.image_suffix }}:${{ github.sha }}"
          docker tag ${{ env.SERVICE_NAME }}${{ inputs.image_suffix }}:${{ github.sha }} $GHCR_TAG
          docker push $GHCR_TAG
