# image をビルドして GHCR へ push する。
#
# かつては Artifact Registry を正として GHCR へは archive として push して
# いたが、Cloud Run を撤去し AR も消したので GHCR だけになった。VPS 上の
# yunirun はここに置いた image を生の commit SHA で取りに来る。
name: Build and Push Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: ${{ inputs.image_name }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_ARGS: ${{ inputs.build_args }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # `build_args` は改行区切りの "KEY=VALUE" 列。空なら追加引数なし。
        # eg. "BUN_PUBLIC_APP_BASE_URL=https://example.com\nBUN_PUBLIC_X=foo"
        # `$BUILD_ARGS` は env 経由 (security: shell injection 回避)。
        run: |
          BUILD_ARG_FLAGS=""
          if [ -n "$BUILD_ARGS" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg $line"
            done <<< "$BUILD_ARGS"
          fi
          docker build $BUILD_ARG_FLAGS -f "$DOCKERFILE" -t "${IMAGE_NAME}:${SHA}" .

      - name: Push to GHCR
        run: |
          GHCR_TAG="ghcr.io/${REPO_OWNER}/${IMAGE_NAME}:${SHA}"
          docker tag "${IMAGE_NAME}:${SHA}" "$GHCR_TAG"
          docker push "$GHCR_TAG"
