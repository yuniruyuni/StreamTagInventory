# main への push のときだけ、全 job の成功後に deploy (deploy-yunirun.yml) を呼ぶ。
# 定期の依存監査は security.yml が受け持つ。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        run: npm install -g bun@1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run tests
        run: bun run check:test

      - name: Build project
        run: bun run build

      - name: Verify generated third-party license page
        run: |
          test -s client/static/third-party-licenses.html
          if git ls-files -- \
            client/static/third-party-licenses.html \
            THIRD_PARTY_NOTICES.md \
            THIRDPARTY_NOTICE.md | grep --quiet .; then
            echo "Third-party notice outputs must be generated, not committed."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        run: npm install -g bun@1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          SKIP_DB_VERIFY: "1"
          TWITCH_CLIENT_ID: ci-e2e-dummy
        run: bun run check:e2e -- --grep-invert "Visual Regression Tests"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        run: npm install -g bun@1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t stream-tag-inventory .

      - name: Test Docker image
        # TWITCH_CLIENT_ID は server/src/index.ts の REQUIRED_ENV 検査を通す
        # ためのダミー。SKIP_DB_VERIFY=1 で server 起動時 SELECT 1 を skip する
        # (この smoke test は /health 200 のみ確認、DB に触る endpoint は叩かない)。
        run: |
          docker run --rm -d -p 3000:3000 --name test-container \
            -e TWITCH_CLIENT_ID=ci-smoke-dummy \
            -e SKIP_DB_VERIFY=1 \
            stream-tag-inventory
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container

  deploy:
    # test / e2e / security / docker がすべて成功した main への push だけ。
    # OIDC の sub は ref:refs/heads/main になり、VPS 側の認可と一致する。
    needs: [test, e2e, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-yunirun.yml
    # 呼ばれる側の job が使う権限の上限。再利用ワークフローは呼び出し側より
    # 多い権限を持てないので、足りないと startup_failure になる。
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
