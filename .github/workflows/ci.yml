name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run tests
        run: bun run check:test

      - name: Build project
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          SKIP_DB_VERIFY: "1"
          TWITCH_CLIENT_ID: ci-e2e-dummy
        run: bun run check:e2e -- --grep-invert "Visual Regression Tests"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        run: npm install -g bun@1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t stream-tag-inventory .

      - name: Test Docker image
        # TWITCH_CLIENT_ID は server/src/index.ts の REQUIRED_ENV 検査を通す
        # ためのダミー。SKIP_DB_VERIFY=1 で server 起動時 SELECT 1 を skip する
        # (この smoke test は /health 200 のみ確認、DB に触る endpoint は叩かない)。
        run: |
          docker run --rm -d -p 3000:3000 --name test-container \
            -e TWITCH_CLIENT_ID=ci-smoke-dummy \
            -e SKIP_DB_VERIFY=1 \
            stream-tag-inventory
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container
