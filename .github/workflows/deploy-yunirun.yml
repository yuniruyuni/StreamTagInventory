# yunirun 経由での VPS デプロイ。
#
# push では起動しない。ci.yml が test / e2e / security / docker の成功後に
# workflow_call で呼ぶ。以前は push で独立に走っていたため、CI が赤い
# commit でもデプロイされていた。workflow_dispatch は手動の再デプロイ用に残す。
#
# yuniruyuni.net 側のアプリ名は tags2 (VPS 上の SSH ユーザーは yunirun-tags)。
# DB は既存のものを共有する (yunirun.jsonc で databaseName と databasePasswords を指定)。
#
# 認証は GitHub Actions の OIDC トークンから opkssh が発行する短命の SSH
# 証明書。VPS 側 (yuniruyuni.net の nixos/services/yunirun.nix) は sub を
#   repo:yuniruyuni@85034901/StreamTagInventory@<id>:ref:refs/heads/main
# と完全一致で照合する。sub はワークフローのファイル名や呼び出し元を含まず、
# 呼び出された場合も呼び出し元の ref で決まるので、ci.yml から呼んでも変わらない。
# deploy job に environment: を付けてはいけない (sub が :environment:<name> になる)。
name: Deploy via yunirun

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    # build-image.yml が宣言している権限を渡す。再利用ワークフローは呼び出し側より
    # 多い権限を持てないので、足りないとワークフロー自体が読み込みを拒否され
    # startup_failure になる。
    permissions:
      contents: read
      packages: write
    with:
      dockerfile: Dockerfile
      image_name: stream-tag-inventory
      build_args: |
        BUN_PUBLIC_TWITCH_CLIENT_ID=d2kz8x5se7k6b1n0picux0r7kaozi3
        BUN_PUBLIC_APP_BASE_URL=https://tags.yuniruyuni.net
    secrets: inherit

  build-migration:
    uses: ./.github/workflows/build-image.yml
    # build-image.yml が宣言している権限を渡す。再利用ワークフローは呼び出し側より
    # 多い権限を持てないので、足りないとワークフロー自体が読み込みを拒否され
    # startup_failure になる。
    permissions:
      contents: read
      packages: write
    with:
      dockerfile: Dockerfile.migration
      image_name: stream-tag-inventory-migration
    secrets: inherit

  deploy:
    needs: [build, build-migration]
    runs-on: ubuntu-latest
    # デプロイの中断は blue/green の入れ替えや migration を中途半端な状態で
    # 止めうるので途中キャンセルはしない。
    concurrency:
      group: deploy-yunirun
      cancel-in-progress: false
    permissions:
      # opkssh が OIDC トークンを取得するのに必須
      id-token: write
      contents: read
      # VPS が GHCR から pull するためのトークンを渡すのに使う。push は build
      # job だけが行うので、VPS に渡るトークンには write を持たせない。
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -Lf "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Install opkssh
        env:
          OPKSSH_VERSION: v0.16.0
          OPKSSH_SHA256: c018c3e7baf98612b923e742dd87be38650bf61e3b755fb2bc90de177568b1bf
        run: |
          curl -sSLf "https://github.com/openpubkey/opkssh/releases/download/${OPKSSH_VERSION}/opkssh-linux-amd64" -o /usr/local/bin/opkssh
          echo "${OPKSSH_SHA256}  /usr/local/bin/opkssh" | sha256sum -c -
          chmod +x /usr/local/bin/opkssh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp ssh/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'SSHCONF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Login (OIDC -> short-lived SSH certificate)
        run: opkssh login github

      - name: Deploy
        env:
          # job の終了とともに失効するので VPS には長期の資格情報を残さない。
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # トークンとマニフェストを stdin の JSON で渡す。argv に載せると
          # ps から見えるため、また VPS が GitHub を取りに行かずに済むため。
          jq -n \
            --arg token "$GHCR_TOKEN" \
            --rawfile manifest yunirun.jsonc \
            '{token: $token, manifest: $manifest}' \
            | ssh -o ConnectTimeout=20 yunirun-tags@ssh.yuniruyuni.net "yunirun deploy $SHA"
